[project]
name = "gazevoice"
version = "0.1.0"
description = "Edit Blender scenes by talking (and later, looking): control center and voice pipeline."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
gazevoice = "gazevoice.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gazevoice*"]

[tool.setuptools.package-data]
gazevoice = ["server/static/*", "voice/prompts/*.md"]
